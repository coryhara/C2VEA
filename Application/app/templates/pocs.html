{% extends "base.html" %}
{% block title %}PoC List{% endblock %}
{% block header %}☄️ PoC List{% endblock %}

{% block content %}
<div id="controls">
  <button onclick="window.location.href='/'">🏠 Home</button>
  <button onclick="window.location.href='/dashboard'">🛡️ CVE Analytics Dashboard</button>
  <button onclick="window.location.href='/cves'">🐞 CVE List</button>
  {% if session.admin_permission == 1 %}
  <button onclick="window.location.href='/logs'">📝 Logs</button>
  <button onclick="window.location.href='/settings'">⚙️ Settings</button>
  {% endif %}
</div>

<form id="pocFilterForm" class="filter-form">
  <div class="filter-row">
    <select name="search_type">
      <option value="title">Title (CVE ID)</option>
      <option value="source">Source</option>
      <option value="author">Author</option>
    </select>
    <input type="text" name="keyword" placeholder="🔍 Search keyword">
  </div>
  <div class="filter-actions">
    <button type="submit">Search</button>
  </div>
</form>

<div id="pagination-top"></div>

<table id="pocTable" class="styled-table">
  <thead>
    <tr>
      <th><button onclick="setSort('id')" id="sort-id">ID <span class="sort-icon"></span></button></th>
      <th><button onclick="setSort('cve_id')" id="sort-cve">CVE <span class="sort-icon"></span></button></th>
      <th><button onclick="setSort('source_identifier')" id="sort-source">Source <span class="sort-icon"></span></button></th>
      <th><button onclick="setSort('url')" id="sort-url">URL <span class="sort-icon"></span></button></th>
      <th><button onclick="setSort('created_at')" id="sort-created">Created <span class="sort-icon"></span></button></th>
      <th>File</th> <!-- ✅ 자연스럽게 이름 변경 -->
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="pagination-bottom"></div>

{% if session.admin_permission == 1 %}
<div style="margin-top: 10px;">
  <a href="/poc/upload"><button>➕ Add PoC</button></a>
</div>
{% endif %}

<script>
function escapeHTML(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[m]);
}

let currentPage = 1;
let currentFilters = {};
let currentSort = { column: "created_at", order: "DESC" };

function setSort(column) {
  if (currentSort.column === column) {
    currentSort.order = currentSort.order === "ASC" ? "DESC" : "ASC";
  } else {
    currentSort = { column, order: "ASC" };
  }
  updateSortIcons();
  loadPOC(1, currentFilters);
}

function updateSortIcons() {
  document.querySelectorAll("th button").forEach(btn => {
    btn.classList.remove("active");
    btn.querySelector(".sort-icon").className = "sort-icon";
  });
  const idMap = {
    "id": "sort-id",
    "cve_id": "sort-cve",
    "source_identifier": "sort-source",
    "url": "sort-url",
    "created_at": "sort-created"
  };
  const activeBtn = document.getElementById(idMap[currentSort.column]);
  if (activeBtn) {
    activeBtn.classList.add("active");
    activeBtn.querySelector(".sort-icon").classList.add(currentSort.order.toLowerCase());
  }
}

function loadPOC(page=1, filters={}) {
  currentPage = page;
  currentFilters = filters;
  const params = new URLSearchParams({ ...filters, page, sort: currentSort.column, order: currentSort.order });
  fetch("/api/pocs?" + params)
    .then(r => r.json())
    .then(data => {
      const tbody = document.querySelector("#pocTable tbody");
      tbody.innerHTML = "";

      data.items.forEach(r => {
        let files = [];
        try { files = r.downloaded_files ? JSON.parse(r.downloaded_files) : []; }
        catch { files = []; }

        const downloadLink = files.length
          ? `<a href="/poc/download/${r.id}" class="link-btn" title="Download">⬇️ Download</a>`
          : "<span style='color:#777;'>—</span>";

        tbody.innerHTML += `
          <tr>
            <td>${r.id}</td>
            <td>${escapeHTML(r.cve_id)}</td>
            <td>${escapeHTML(r.source_identifier)}</td>
            <td>${r.url ? `<a href="${escapeHTML(r.url)}" target="_blank" class="link-btn">🌐 ${escapeHTML(r.url)}</a>` : ""}</td>
            <td>${escapeHTML(r.created_at)}</td>
            <td>${downloadLink}</td>
          </tr>`;
      });

      renderPagination("pagination-top", data);
      renderPagination("pagination-bottom", data);
    });
}

function renderPagination(elementId, data) {
  const pagination = document.getElementById(elementId);
  pagination.innerHTML = "";
  let start = Math.max(1, data.page - 5);
  let end = Math.min(data.pages, data.page + 5);
  if (data.page > 1) pagination.innerHTML += `<button onclick="loadPOC(${data.page-1}, currentFilters)">Prev</button>`;
  for (let i = start; i <= end; i++) {
    pagination.innerHTML += `<button onclick="loadPOC(${i}, currentFilters)" ${i===data.page?'class="active-page"':''}>${i}</button>`;
  }
  if (data.page < data.pages) pagination.innerHTML += `<button onclick="loadPOC(${data.page+1}, currentFilters)">Next</button>`;
}

document.getElementById("pocFilterForm").onsubmit = e => {
  e.preventDefault();
  const form = new FormData(e.target);
  const searchType = form.get("search_type");
  const keyword = form.get("keyword");
  const filters = {};
  if (keyword) filters["search_type"] = searchType, filters["keyword"] = keyword;
  loadPOC(1, filters);
};

loadPOC(1);
</script>

<style>
/* 원래 버튼 스타일에 자연스럽게 녹아들도록 */
.link-btn {
  color: #4da6ff;
  text-decoration: none;
}
.link-btn:hover {
  text-decoration: underline;
}

/* 다운로드 버튼 스타일을 기존 버튼 톤에 맞춤 */
.link-btn.download {
  color: #9ef0ff;
}

/* 페이지 버튼 강조 */
button.active-page {
  background-color: #2d2d2d;
  font-weight: bold;
  border: 1px solid #666;
}
</style>
{% endblock %}
