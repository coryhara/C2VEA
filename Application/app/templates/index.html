{% extends "base.html" %}
{% block title %}Real-Time Log Viewer{% endblock %}
{% block header %}🧪 REAL-TIME LOG VIEWER{% endblock %}

{% block content %}
<div id="controls">
  <button onclick="window.location.href='/poc'">PoC Upload</button>
  <button onclick="run('run-main')">Run Main (All)</button>
  <button onclick="run('run-cve')">Run CVE</button>
  <button onclick="run('run-github')">Run GitHub</button>
  <button onclick="run('run-backup')">Run Backup</button>
  <button onclick="window.location.href='/settings'">⚙️ Settings</button>
  <button onclick="stopTasks()">🛑 Stop</button>
</div>

<div id="statusBar">No active tasks</div>
<div id="loadings">⏳ Loading tasks will be shown here...</div>
<div id="alerts">📢 Notifications will appear here</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Status</th>
      <th>Message</th>
      <th>Time (KST)</th>
    </tr>
  </thead>
  <tbody id="logTableBody"></tbody>
</table>
{% endblock %}
