<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <title>{% block title %}Real-Time Viewer{% endblock %}</title>
  <style>
    body {
      background: #121212;
      color: #8de0d6;
      font-family: "Courier New", monospace;
      margin: 2rem;
    }
    h1 {
      color: #74cfc5;
      text-shadow: 0 0 2px #2d837c;
    }
    #controls {
      margin: 1.5rem 0;
    }
    button {
      margin: 0.3rem;
      padding: 0.6rem 1.2rem;
      background: #1f1f1f;
      border: 1px solid #5aaba2;
      color: #8de0d6;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: 0.2s;
    }
    button:hover {
      background: #2d2d2d;
      color: #b0fff5;
      border-color: #8de0d6;
    }
    #alerts,
    #loadings {
      margin-bottom: 1rem;
      padding: 10px;
      background: #1c1c1c;
      border-left: 4px solid #c77d4c;
      color: #e2cbb5;
    }
    #alerts div,
    #loadings div {
      margin-bottom: 6px;
    }
    .loading-msg {
      color: #ffd966;
      font-weight: bold;
      font-size: 15px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #2a2a2a;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #202020;
      color: #99d3cc;
    }
    tbody {
      font-size: 14px;
    }
    tr:nth-child(even) {
      background: #181818;
    }
    tr:hover {
      background: #222;
    }
    #statusBar {
      margin: 1rem 0;
      font-size: 15px;
      font-weight: bold;
    }
    form {
      background: #1c1c1c;
      padding: 2rem;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      max-width: 2000px;
      margin: 2rem auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
    }
    label {
      display: inline-block;
      min-width: 180px;
      color: #99d3cc;
      font-size: 1rem;
    }
    input[type="text"],
    input[type="url"],
    input[type="file"] {
      background: #121212;
      color: #8de0d6;
      border: 1px solid #2a2a2a;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      flex: 1;
    }
    .row {
      margin: 1rem 0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .hint {
      color: #c9a27a;
      font-size: 0.9rem;
      margin: 0.2rem 0 1rem;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <h1>{% block header %}🧪 REAL-TIME VIEWER{% endblock %}</h1>

  {% block content %}{% endblock %}
  {% block scripts %}
  <script>
    const alerts = document.getElementById("alerts");
    const loadings = document.getElementById("loadings");
    const statusBar = document.getElementById("statusBar");
    const tableBody = document.getElementById("logTableBody");

    const logs = [];
    const MAX_LOGS = 1000;
    const activeTasks = new Set();

    const socket = io("http://localhost:8080", {
      path: "/socket.io/",
      transports: ["websocket"],
    });

    socket.on("connect", () => {
      console.log("Socket connected:", socket.id);
      socket.emit("subscribe_logs", { last_id: 0 });
      socket.emit("request_active");
    });

    socket.on("logs", (rows) => {
      if (!tableBody) return;
      for (const log of rows) prependLog(log);
    });

    socket.on("active", (items) => {
      if (!Array.isArray(items)) return;
      for (const it of items) {
        const task = String(it.label || "").toLowerCase();
        if (!task) continue;
        if (!activeTasks.has(task)) {
          activeTasks.add(task);
          addLoading(task);
        }
      }
    });

    socket.on("notify", (msg) => {
      showAlert(msg.message);
      const lower = (msg.label || "").toLowerCase();
      if (isFinalMessage(msg.message)) {
        removeLoading(lower);
      }
    });

    function prependLog(log) {
      logs.unshift(log);
      if (logs.length > MAX_LOGS) logs.pop();
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${log.id}</td>
        <td>${escapeHtml(log.status || "")}</td>
        <td>${escapeHtml(log.message || "")}</td>
        <td>${log.log_time || ""}</td>
      `;
      tableBody.insertBefore(tr, tableBody.firstChild);
      if (tableBody.rows.length > MAX_LOGS) {
        tableBody.deleteRow(-1);
      }
    }

    function showAlert(message) {
      const div = document.createElement("div");
      div.textContent = message;
      if (message.startsWith("✅")) div.style.color = "#90ee90";
      else if (message.startsWith("❌")) div.style.color = "#f08080";
      else div.style.color = "#e2cbb5";
      alerts.prepend(div);
      setTimeout(() => {
        if (alerts.contains(div)) alerts.removeChild(div);
      }, 10000);
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.innerText = s || "";
      return div.innerHTML;
    }

    function addLoading(task) {
      if (document.getElementById(`loading-${task}`)) return;
      const div = document.createElement("div");
      div.textContent = `⏳ Loading... [${task}]`;
      div.id = `loading-${task}`;
      div.classList.add("loading-msg");
      loadings.appendChild(div);
    }

    function removeLoading(task) {
      activeTasks.delete(task);
      const div = document.getElementById(`loading-${task}`);
      if (div) loadings.removeChild(div);
    }

    function isFinalMessage(message) {
      const m = String(message || "").toLowerCase();
      return /\b(done|completed|finished|success(?:ful|fully)?|all tasks complete|backup complete|cve (?:job|sync) complete)\b/.test(m);
    }

    function stopTasks() {
      fetch("/stop")
        .then((r) =>
          r.json().catch(() => ({})).then((j) => ({ ok: r.ok, json: j }))
        )
        .then(({ ok, json }) => {
          showAlert((ok ? "✅ " : "❌ ") + (json.message || "(no message)"));
          if (ok) {
            for (const task of Array.from(activeTasks)) {
              removeLoading(task);
            }
          }
        })
        .catch((err) => {
          showAlert("❌ Stop request failed: " + err.message);
        });
    }

    function run(api) {
      console.log("▶️ [API CALL]", api);
      fetch("/" + api)
        .then((r) => r.json().catch(() => ({})))
        .then((json) => {
          console.log("📥 [API RESPONSE]", api, json);
          showAlert(json.message || "(no message)");
        })
        .catch((err) => {
          showAlert("❌ Request failed: " + err.message);
        });
    }

    function fetchStatus() {
      if (!statusBar) return;
      fetch("/status")
        .then((r) => r.json().catch(() => r.text()))
        .then((data) => {
          if (typeof data === "string") {
            try {
              const jsonPart = data.substring(data.indexOf("{"));
              data = JSON.parse(jsonPart);
            } catch (e) {
              console.error("JSON parse error:", e, data);
              data = { running: [] };
            }
          }
          const runningTasks = Array.isArray(data.running) ? data.running : [];
          statusBar.textContent =
            runningTasks.length > 0
              ? "Running: " + runningTasks.join(", ")
              : "No active tasks";
          loadings.innerHTML = "";
          if (runningTasks.length > 0) {
            runningTasks.forEach((task) => {
              const div = document.createElement("div");
              div.textContent = `⏳ [${task}] running`;
              div.className = "loading-msg";
              loadings.appendChild(div);
            });
          } else {
            loadings.innerHTML = "<div>No running tasks...</div>";
          }
        })
        .catch((err) => console.error("Status API error", err));
    }

    setInterval(fetchStatus, 1000);
  </script>
  {% endblock %}
</body>
</html>
