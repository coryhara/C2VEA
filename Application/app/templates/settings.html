{% extends "base.html" %}
{% block title %}App Settings{% endblock %}
{% block header %}⚙️ App Settings{% endblock %}

{% block content %}
<div id="controls">
  <button onclick="window.location.href='/'">← Back to Logs</button>
  <button onclick="window.location.href='/cves'">🐞 CVE List</button>
  <button onclick="window.location.href='/pocs'">☄️ PoC List</button>
  <button onclick="window.location.href='/dashboard'">🛡️ CVE Analytics Dashboard</button>
</div>

<form action="/settings" method="POST">
  {% for key, value in settings.items() %}
  <div class="row">
    <label for="{{ key }}">{{ key }}:</label>
    <input id="{{ key }}" type="text" name="{{ key }}" value="{{ value }}" placeholder="Enter {{ key }}" required />
  </div>
  {% endfor %}
  <div class="row" style="justify-content: flex-end">
    <button type="submit">Save</button>
  </div>
</form>
{% endblock %}
