{% extends "base.html" %}
{% block title %}App Settings{% endblock %}
{% block header %}Application Settings{% endblock %}

{% block content %}
<form action="/settings" method="POST" class="settings-form">
  {% for key, value in settings.items() %}
  <div class="settings-row">
    <label for="{{ key }}">{{ key }}</label>
    <input
      id="{{ key }}"
      type="text"
      name="{{ key }}"
      value="{{ value }}"
      placeholder="Enter {{ key }}"
      {% if "TOKEN" in key %}autocomplete="off" spellcheck="false"{% endif %}
      required
    />
  </div>
  {% endfor %}
  <div class="settings-actions">
    <button type="submit">Save</button>
  </div>
</form>
{% endblock %}
