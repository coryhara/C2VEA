services:
  mariadb:
    build:
      context: ../Database
      dockerfile: Dockerfile
    container_name: Database
    environment:
      TZ: Asia/Seoul
      MARIADB_USER: archive
      MARIADB_PASSWORD: archive
      MARIADB_DATABASE: archive
      MARIADB_ROOT_PASSWORD: archive
    volumes:
      - ../Database/init-scripts:/docker-entrypoint-initdb.d
      - ../Data/Database/mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: always
    networks:
      - mariadb_network

  api-server:
    build:
      context: ../APIServer
      dockerfile: Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    container_name: APIServer
    depends_on:
      - mariadb
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ../Data/cve:/app/cve
      - ../Data/poc_sources:/app/poc_sources
      - ../Data/backups:/app/backups
    restart: always
    networks:
      - mariadb_network

  web-app:
    build:
      context: ../Application
      dockerfile: Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    container_name: Application
    depends_on:
      - mariadb
    env_file:
      - ../Application/.env
    environment:
      TZ: Asia/Seoul
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - ../Data/poc_sources:/app/poc_sources
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mariadb_network

networks:
  mariadb_network:
    driver: bridge
